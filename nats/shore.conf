# Shore's NATS server. Shore-side processes connect here; the ship connects
# as a leafnode on 7422. The OFFLOAD stream in this domain is a mirror of the
# ship's, pulled over that link (see sim/streams.py), so a link outage is a
# mirror that stops advancing and catches up when the link is back.
server_name: nats-shore
listen: 0.0.0.0:4222

jetstream {
  store_dir: /data
  domain: shore
}

leafnodes {
  port: 7422
}
