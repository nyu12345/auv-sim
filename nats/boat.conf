# The ship's NATS server. Hulls publish here; it is the only server they can
# reach. JetStream keeps the OFFLOAD stream on /data, and its own domain
# keeps its API separate from shore's across the leafnode.
#
# The ship dials shore: that is how a vessel with an intermittent uplink is
# set up, and it means shore never has to name a ship. If shore is not
# reachable the server keeps retrying; nothing on the ship side cares.
server_name: nats-boat
listen: 0.0.0.0:4222

jetstream {
  store_dir: /data
  domain: boat
}

leafnodes {
  remotes: [
    { url: "nats-leaf://nats-shore:7422" }
  ]
}
